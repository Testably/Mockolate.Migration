version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "23:20"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: chore

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "23:20"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: chore
    groups:
      fallout:
        patterns:
          - "Fallout*"
      tunit:
        patterns:
          - "tunit*"
      aweXpect:
        patterns:
          - "aweXpect*"
    # The analyzers and generators only load in compilers at least as new as the Roslyn they reference.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis*"
